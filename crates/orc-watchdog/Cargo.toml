[package]
name = "orc-watchdog"
version = "0.1.0"
edition = "2024"

[dependencies]
orc-execution = { path = "../orc-execution" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
libc = "0.2"
orc-backend-host-linux = { path = "../orc-backend-host-linux" }
orc-backend-gvisor = { path = "../orc-backend-gvisor" }
