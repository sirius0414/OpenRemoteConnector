[package]
name = "orc-backend-host-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
orc-execution = { path = "../orc-execution" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
