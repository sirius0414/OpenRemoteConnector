[package]
name = "orc-execution"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
