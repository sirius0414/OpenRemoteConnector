[package]
name = "orc-workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rustix = { version = "1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
